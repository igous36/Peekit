[package]
name = "peekit"
version = "0.1.0"
description = "Peekit：磨砂玻璃时间轴插画浏览器"
edition = "2021"

[lib]
# 名字和二进制区分开，避免 Windows 上 cargo 的同名冲突
name = "peekit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset：前端用 asset 协议直接读原图和缩略图
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
# 只开需要的解码器：PNG / JPEG / WebP
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "rayon"] }
# 读 EXIF 日期和方向（JPEG / PNG / WebP 都支持）
kamadak-exif = "0.6"
# 缩略图用有损 WebP（image 自带的 WebP 编码器只有无损）
webp = "0.3"
walkdir = "2"
rayon = "1"

# 安装包要小：发布版按体积优化
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# 开发时图片解码太慢会影响体验：依赖按优化编译，自己的代码仍是 debug
[profile.dev.package."*"]
opt-level = 2
