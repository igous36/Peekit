[package]
name = "peekit"
version = "0.2.0-beta.2"
description = "Peekit：磨砂玻璃时间轴插画浏览器"
edition = "2021"

[lib]
# 名字和二进制区分开，避免 Windows 上 cargo 的同名冲突
name = "peekit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset：前端用 asset 协议直接读原图和缩略图
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
# 只开需要的解码器：PNG / JPEG / WebP，2026-11-17 加 GIF / BMP / TIFF（都是纯 Rust）。
# SVG 不经过这里：界面直接显示矢量原图，尺寸在 svg.rs 里从文件头读
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "rayon"] }
# 色彩管理（2026-11-20）：图片里嵌的 ICC 配置文件转 sRGB（color.rs）。image 本来就依赖它，版本跟着 image 走
moxcms = "0.8"
# 读 EXIF 日期和方向（JPEG / PNG / WebP 都支持）
kamadak-exif = "0.6"
# 缩略图用有损 WebP（image 自带的 WebP 编码器只有无损）
webp = "0.3"
walkdir = "2"
rayon = "1"
tauri-plugin-opener = "2"
# 自动更新：用系统 TLS（Windows 是 schannel）代替自带的 rustls，安装包小约 0.6 MB；保留系统代理；Windows 的 exe / msi 更新包用不到 zip
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }

# 安装包要小：发布版按体积优化
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# 开发时图片解码太慢会影响体验：依赖按优化编译，自己的代码仍是 debug
[profile.dev.package."*"]
opt-level = 2
